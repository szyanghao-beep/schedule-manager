<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>日程管理</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">日程管理</div>
      <nav class="nav">
        <button class="nav-item active" data-view="schedule">日程</button>
        <button class="nav-item" data-view="todo">待办</button>
        <button class="nav-item" data-view="search">搜索</button>
        <button class="nav-item" data-view="stats">统计</button>
        <button class="nav-item" data-view="settings">设置</button>
      </nav>
    </aside>
    <main class="content">
      <section id="view-schedule" class="view active"></section>
      <section id="view-todo" class="view"></section>
      <section id="view-search" class="view"></section>
      <section id="view-stats" class="view"></section>
      <section id="view-settings" class="view"></section>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <div id="context-menu-root"></div>

  <script src="js/utils.js"></script>
  <script src="js/dom.js"></script>
  <script src="js/api.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/store.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/contextMenu.js"></script>
  <script src="js/modules/schedule.js"></script>
  <script src="js/modules/todo.js"></script>
  <script src="js/modules/search.js"></script>
  <script src="js/modules/stats.js"></script>
  <script src="js/modules/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
