name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 必须 ≥22：① 内嵌同步服务用 node:sqlite（Node 20 没有此模块，
          # test/system.contract.test.js 会 require 它 → 整个 test job 崩，
          # 而 release job needs [mac, win] ← needs [test]，于是永远发不出 Release）；
          # ② jsdom 30 的 engines 要求 ^22.22.2 || ^24.15.0。
          # 用 24 与本机验证过的版本一致（Node 20 已 EOL）。
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  server-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server

  mac:
    runs-on: macos-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  win:
    runs-on: windows-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error

  # 安卓 APK 也要进 Release —— 手机端与桌面端是同一套发布版本，
  # 只把桌面安装包放上 Release、APK 仅作为 Actions artifact 的话，
  # 用户拿不到手机端（artifact 需登录 GitHub 且 90 天过期）。
  # 步骤与 build-apk.yml 保持一致（那边已验证可跑通）。
  android:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: 安装 npm 依赖
        run: |
          cd mobile
          npm install
      - name: 构建 release APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: 规范 APK 文件名（GitHub 会剥掉非 ASCII 字符）
        run: |
          VER=$(node -p "require('./package.json').version")
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "schedule-manager-android-$VER.apk"
          ls -l "schedule-manager-android-$VER.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: schedule-manager-android-*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [mac, win, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # 顺序很重要：先上传本次产物，再删陈旧资产。
      # 反过来（先清后传）一旦上传失败就会留下一个「空 Release」，
      # 那比留着几个陈旧资产糟糕得多。
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**

      # 收尾清理：删掉不在本次产物清单里的陈旧资产，让「重跑发布」幂等。
      #
      # 三点刻意的设计（都是踩过坑之后加的）：
      # 1. 放在上传**之后**：反过来（先清后传）一旦上传失败会留下空 Release，更糟。
      # 2. `continue-on-error` + `set +e`：此时产物已发布成功，收尾失败不该把整次
      #    发布判为失败（上次正是如此：android/mac/win/test 全 success、产物也传上去了，
      #    只因清理步骤报错就让 release job 变红）。
      # 3. 用「资产 id」删除 + `grep -qxF` 精确比对：陈旧资产名可能以 `-` 开头
      #    （中文被 GitHub 剥掉后就是 -2.3.4.dmg），当参数传给 gh 会被当成命令行选项
      #    而报错；也不用 awk -F'\t' / comm 这类对分隔符敏感、易出错的写法。
      - name: 清理不在本次产物清单里的陈旧资产（保证重跑幂等）
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "== 本次产物 =="
          allow=$(find artifacts -maxdepth 1 -type f -printf '%f\n' | sort)
          echo "$allow"

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            --jq '.assets[] | "\(.id) \(.name)"' > /tmp/assets.txt
          if [ ! -s /tmp/assets.txt ]; then
            echo "读取资产列表为空或失败，跳过清理"
            exit 0
          fi

          while read -r id name; do
            [ -z "$id" ] && continue
            if printf '%s\n' "$allow" | grep -qxF "$name"; then
              continue
            fi
            echo "删除陈旧资产: $name (id=$id)"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$id" \
              && echo "  已删除" || echo "  删除失败（忽略，不影响已发布的产物）"
          done < /tmp/assets.txt

          echo "== 最终资产 =="
          gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' || true
