name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 必须 ≥22：① 内嵌同步服务用 node:sqlite（Node 20 没有此模块，
          # test/system.contract.test.js 会 require 它 → 整个 test job 崩，
          # 而 release job needs [mac, win] ← needs [test]，于是永远发不出 Release）；
          # ② jsdom 30 的 engines 要求 ^22.22.2 || ^24.15.0。
          # 用 24 与本机验证过的版本一致（Node 20 已 EOL）。
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  server-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server

  mac:
    runs-on: macos-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  win:
    runs-on: windows-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error

  # 安卓 APK 也要进 Release —— 手机端与桌面端是同一套发布版本，
  # 只把桌面安装包放上 Release、APK 仅作为 Actions artifact 的话，
  # 用户拿不到手机端（artifact 需登录 GitHub 且 90 天过期）。
  # 步骤与 build-apk.yml 保持一致（那边已验证可跑通）。
  android:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: 安装 npm 依赖
        run: |
          cd mobile
          npm install
      - name: 构建 release APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: 规范 APK 文件名（GitHub 会剥掉非 ASCII 字符）
        run: |
          VER=$(node -p "require('./package.json').version")
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "schedule-manager-android-$VER.apk"
          ls -l "schedule-manager-android-$VER.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: schedule-manager-android-*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [mac, win, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # 顺序很重要：先上传本次产物，再删陈旧资产。
      # 反过来（先清后传）一旦上传失败就会留下一个「空 Release」，
      # 那比留着几个陈旧资产糟糕得多。
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**

      - name: 清理不在本次产物清单里的陈旧资产（保证重跑幂等）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find artifacts -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/want.txt
          echo "== 本次产物 =="; cat /tmp/want.txt
          gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | sort > /tmp/have.txt
          comm -13 /tmp/want.txt /tmp/have.txt > /tmp/stale.txt || true
          if [ -s /tmp/stale.txt ]; then
            while read -r n; do
              if [ -n "$n" ]; then echo "删除陈旧资产: $n"; gh release delete-asset "${GITHUB_REF_NAME}" "$n" -y; fi
            done < /tmp/stale.txt
          else
            echo "没有需要清理的陈旧资产"
          fi
          echo "== 最终资产 =="
          gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name'
