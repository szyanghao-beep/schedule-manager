name: build-apk

# 构建安卓端 release APK（JS bundle 已打包，独立安装运行、无需 Metro），产物作为 artifact 下载。
# 触发：手动（workflow_dispatch）或 mobile/、shared/ 变更。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'shared/**'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 npm 依赖
        run: |
          cd mobile
          npm install

      - name: 构建 release APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 日程管理-安卓端-release
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
